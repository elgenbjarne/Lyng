/* ---- bakgrunnslyd: holder fanen i live når skjermen slås av ---- */
let lydEl = null;

function stilleLyd(sek) {
  const sr = 8000, n = sr * sek;
  const buf = new ArrayBuffer(44 + n), dv = new DataView(buf);
  const skriv = (o, t) => { for (let i = 0; i < t.length; i++) dv.setUint8(o + i, t.charCodeAt(i)); };
  skriv(0, "RIFF"); dv.setUint32(4, 36 + n, true); skriv(8, "WAVEfmt ");
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, sr, true); dv.setUint32(28, sr, true);
  dv.setUint16(32, 1, true); dv.setUint16(34, 8, true);
  skriv(36, "data"); dv.setUint32(40, n, true);
  for (let i = 0; i < n; i++) dv.setUint8(44 + i, 128 + (i & 1));  // ett bit — under hørselsgrensa
  return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
}

async function startBakgrunn() {
  if (lydEl) return true;
  try {
    lydEl = new Audio(stilleLyd(3));
    lydEl.loop = true;
    lydEl.volume = 0.1;
    await lydEl.play();
  } catch (e) { lydEl = null; return false; }
  if ("mediaSession" in navigator) {
    try {
      navigator.mediaSession.metadata = new MediaMetadata({ title: "Lyng sporer", artist: "Blåbærtur" });
      navigator.mediaSession.setActionHandler("pause", () => settBakgrunn(false));
      navigator.mediaSession.setActionHandler("play", () => { if (lydEl) lydEl.play(); });
    } catch (e) { /* eldre nettleser */ }
  }
  return true;
}

function stoppBakgrunn() {
  if (!lydEl) return;
  try { lydEl.pause(); lydEl.removeAttribute("src"); lydEl.load(); } catch (e) {}
  lydEl = null;
}

async function settBakgrunn(pa) {
  S.bg = pa ? 1 : 0;
  const sel = document.getElementById("setBg");
  if (pa) {
    const ok = await startBakgrunn();
    if (!ok) { S.bg = 0; melding("Fikk ikke startet — trykk en gang til"); }
    else melding("Bakgrunn på — lås skjermen og gå", 3000);
  } else {
    stoppBakgrunn();
  }
  sel.value = String(S.bg);
  lagreNa();
}

function hullTekst() {
  if (nativ) return "Bakgrunnstjenesten holder GPS-en tilgjengelig. Gålinje og tåke lagres bare mens en tur er aktiv.";
  if (S.bg !== 1 && !hull.length) return "Strømsparing gjør skjermen svart, men appen sporer videre. Bakgrunn er et forsøk — telefonen din bestemmer om det virker.";
  if (!hull.length) return "Ingen hull i sporingen registrert. Fungerer på denne telefonen.";
  const lengste = Math.max(...hull.map(h => h.sek));
  return `${hull.length} hull over 90 sek, lengste ${Math.round(lengste / 60)} min. ` +
    (lengste > 420
      ? "Telefonen fryser appen når skjermen er av — bruk strømsparing i stedet."
      : "Sporingen har holdt seg noenlunde i live.");
}

function gpx() {
  const esc = s => String(s || "").replace(/[<>&]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]));
  const wpt = merker.map(m =>
    `  <wpt lat="${m.lat}" lon="${m.lng}"><time>${new Date(m.t).toISOString()}</time>` +
    `<name>${esc((FARGER[m.type] || FARGER.funn).navn)}${m.liter ? " " + m.liter + " l" : ""}</name>` +
    `<desc>${esc(m.notat)}</desc></wpt>`)
    .concat(bench.map(b =>
      `  <wpt lat="${b.lat}" lon="${b.lng}"><time>${new Date(b.t0).toISOString()}</time>` +
      `<name>Måling ${fmt1(rateLT(b))} l/t</name><desc>${b.liter} l, ${b.metode}, ${b.dist} m</desc></wpt>`))
    .join("\n");
  const trk = [...turer].sort((a, b) => (a.t0 || 0) - (b.t0 || 0)).filter(t => (t.spor || []).length).map(t => {
    const navn = new Date(t.t0).toLocaleString("no-NO", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
    const pts = t.spor.map(p => `      <trkpt lat="${p[0]}" lon="${p[1]}"><time>${new Date(p[2]).toISOString()}</time></trkpt>`).join("\n");
    return `  <trk><name>Lyng ${esc(navn)}</name><trkseg>\n${pts}\n  </trkseg></trk>`;
  }).join("\n");
  lastNed(`lyng-${new Date().toISOString().slice(0, 10)}.gpx`,
`<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Lyng 3.2" xmlns="http://www.topografix.com/GPX/1/1">
${wpt}
${trk}
</gpx>`, "application/gpx+xml");
}

async function importer(tekst) {
  let d;
  try { d = JSON.parse(tekst); } catch (e) { melding("Klarte ikke lese fila"); return; }
  if (!d || typeof d !== "object") { melding("Klarte ikke lese fila"); return; }

  const nyMerker = (d.merker || []).filter(m => m && m.lat != null && m.lng != null);
  const nySoner = (d.soner || []).filter(x => x && Array.isArray(x.pkt) && x.pkt.length > 2);
  const nyBench = (d.bench || []).filter(x => x && x.t0 && typeof x.liter === "number");
  let nyTurer = (d.turer || []).map(normaliserTur).filter(Boolean);
  if (!nyTurer.length && Array.isArray(d.spor) && d.spor.length) {
    const t0 = +(d.spor[0][2] || Date.now());
    nyTurer = [{
      id: "import-" + t0.toString(36), t0,
      t1: +(d.spor[d.spor.length - 1][2] || t0), status: "avsluttet",
      distanse: Math.max(0, +d.distanse || 0), spor: d.spor,
      sesong: new Date(t0).getFullYear()
    }];
  }

  const cellePoster = [];
  const ci = d.celler || {};
  if (+ci.version === 2 && ci.years) {
    for (const [aar, y] of Object.entries(ci.years)) {
      for (const k of (y && y.passert) || []) cellePoster.push([k, +aar, DEKNING.passert]);
      for (const k of (y && y.undersokt) || []) cellePoster.push([k, +aar, DEKNING.undersokt]);
    }
  } else {
    for (const [aar, arr] of Object.entries(ci)) if (Array.isArray(arr))
      for (const k of arr) cellePoster.push([k, +aar, DEKNING.undersokt]);
  }

  if (!nyMerker.length && !nySoner.length && !nyBench.length && !nyTurer.length && !cellePoster.length) {
    melding("Fant ingen data i fila"); return;
  }

  const kildeGridRaw = d.meta && d.meta.grid != null ? d.meta.grid : (d.S ? d.S.grid : null);
  const kildeLat0Raw = d.meta && d.meta.lat0 != null ? d.meta.lat0 : (d.S ? d.S.lat0 : null);
  const kildeGrid = kildeGridRaw == null ? NaN : +kildeGridRaw;
  const kildeLat0 = kildeLat0Raw == null ? NaN : +kildeLat0Raw;
  let importerCeller = cellePoster.length > 0;
  let adopterGeometri = false;
  if (importerCeller && (!Number.isFinite(kildeGrid) || !Number.isFinite(kildeLat0))) {
    importerCeller = false;
  } else if (importerCeller && celler.size === 0) {
    adopterGeometri = true;
  } else if (importerCeller && celler.size > 0) {
    const gridUlik = Number.isFinite(kildeGrid) && Math.abs(kildeGrid - S.grid) > 1e-9;
    const latUlik = Number.isFinite(kildeLat0) && S.lat0 != null && Math.abs(kildeLat0 - S.lat0) > 1e-7;
    if (gridUlik || latUlik) importerCeller = false;
  }

  const celleInfo = cellePoster.length
    ? (importerCeller ? `${cellePoster.length} dekningsruter` : `${cellePoster.length} dekningsruter HOPPES OVER (annet rutenett)`)
    : "ingen dekningsruter";
  if (!confirm(`Importere ${nyTurer.length} turer, ${nyMerker.length} merker, ${nySoner.length} soner, ${nyBench.length} målinger og ${celleInfo}?\n\nDet du har fra før beholdes.`)) return;

  if (adopterGeometri) {
    S.grid = kildeGrid;
    if (Number.isFinite(kildeLat0)) S.lat0 = kildeLat0;
  }

  const mId = new Set(merker.map(x => x.id));
  for (const m of nyMerker) {
    if (m.type === "bil") m.type = "sekk";
    if (!mId.has(m.id)) { merker.push(m); mId.add(m.id); }
  }
  const sekker = merker.filter(m => m.type === "sekk").sort((a, b) => (b.t || 0) - (a.t || 0));
  if (sekker.length > 1) merker = merker.filter(m => m.type !== "sekk" || m === sekker[0]);

  const sId = new Set(soner.map(x => x.id));
  for (const x of nySoner) if (!sId.has(x.id)) { soner.push(x); sId.add(x.id); }

  const bId = new Set(bench.map(x => x.id));
  for (const x0 of nyBench) {
    if (bId.has(x0.id)) continue;
    const x = { ...x0 };
    if (!importerCeller && Array.isArray(x.celler)) x.celler = [];
    bench.push(x); bId.add(x.id);
  }

  const tId = new Set(turer.map(x => x.id));
  for (const x0 of nyTurer) {
    if (tId.has(x0.id)) continue;
    const x = { ...x0 };
    // En import skal aldri starte bakgrunnssporing ved et uhell.
    if (!x.t1) x.t1 = (x.spor && x.spor.length ? +x.spor[x.spor.length - 1][2] : Date.now());
    x.status = "avsluttet";
    turer.push(x); tId.add(x.id);
  }

  if (importerCeller) for (const [k, aar, nivaa] of cellePoster) settCelleNivaa(k, aar, nivaa);

  if (!aktivTur() && !vistTur()) {
    const t = sisteTur();
    if (t) settVistTur(t.id, false);
  }
  await lagreNa();
  document.getElementById("setGrid").value = String(S.grid);
  fyllAar(); tegnMerker(); tegnSoner(); taake.tegn(); oppdaterHud(); fyllLister(); oppdaterTurUI();
  melding(importerCeller || !cellePoster.length ? "Importert" : "Importert uten inkompatibel tåke", 3500);
}

document.getElementById("btnImport").addEventListener("click", () => {
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = ".json,application/json";
  inp.style.display = "none";
  document.body.appendChild(inp);
  inp.onchange = async () => {
    const f = inp.files && inp.files[0];
    if (f) await importer(await f.text());
    inp.remove();
  };
  inp.click();
});

document.getElementById("btnGpx").addEventListener("click", gpx);
document.getElementById("btnBackup").addEventListener("click", () =>
  lastNed(`lyng-backup-${new Date().toISOString().slice(0, 10)}.json`, pakk(), "application/json"));
document.getElementById("btnNullstillSpor").addEventListener("click", () => {
  const t = vistTur();
  if (!t) { melding("Ingen gålinje å slette"); return; }
  if (!confirm("Slette gålinjen og distansen for turen som vises? Undersøkt terreng, merker, soner og målinger beholdes.")) return;
  t.spor = []; t.distanse = 0;
  if (t.id === aktivTurId) nullstillAktivitetsfilter();
  settVistTur(t.id, false);
  sporLinje.setLatLngs([]); lagreNa(); oppdaterHud(); fyllLister();
});
document.getElementById("btnNullstillAlt").addEventListener("click", async () => {
  if (!confirm("Slette ALT — tåke, turer, merker, soner og målinger? Kan ikke angres.")) return;
  celler.clear(); merker = []; soner = []; bench = []; turer = []; aktivTurId = null; visTurId = null;
  spor = []; distanse = 0; sisteFix = null; hull = []; gpsVindu = []; sporTilstand = "ukjent";
  sporLinje.setLatLngs([]);
  await lagreNa();
  tegnMerker(); tegnSoner(); taake.tegn(); oppdaterHud(); fyllAar(); fyllLister(); oppdaterTurUI();
  melding("Alt slettet");
});

function fyllAar() {
  const sel = document.getElementById("setYear");
  const aar = celleAarstall();
  for (const m of merker) aar.add(new Date(m.t).getFullYear());
  for (const b of bench) aar.add(new Date(b.t0).getFullYear());
  for (const t of turer) aar.add(+t.sesong || new Date(t.t0).getFullYear());
  const val = S.aar;
  sel.innerHTML = '<option value="alle">Alle år</option>' +
    [...aar].sort((a, b) => b - a).map(a => `<option value="${a}">${a}</option>`).join("");
  sel.value = val;
}

/* ---- oppstart ---- */
(async function oppstart() {
  await lastInn();
  kartlag.setUrl((LAG[S.lag] || LAG.topo).url);
  if (!MANUELLE_MODUSER.includes(S.sporModus)) S.sporModus = "auto";
  const gridEl = document.getElementById("setGrid");
  gridEl.value = String(S.grid);
  gridEl.addEventListener("change", () => {
    const gammel = S.grid, ny = +gridEl.value;
    if (ny === gammel) return;
    const harGridData = celler.size > 0 || bench.some(b => Array.isArray(b.celler) && b.celler.length);
    if (harGridData && !confirm("Ny rutestørrelse kan ikke bruke gamle dekningsruter. Slette tåken og målingenes kartflater? Selve målingene beholdes.")) {
      gridEl.value = String(gammel);
      return;
    }
    S.grid = ny;
    celler.clear();
    for (const b of bench) b.celler = [];
    lagreNa(); taake.tegn(); oppdaterHud(); fyllLister();
  });
  kobleValg("setRadius", "radius");
  kobleValg("setWalkRadius", "walkRadius");
  kobleValg("setAcc", "acc");
  kobleValg("setWake", "wake", () => settWake(S.wake === 1));
  kobleValg("setSpar", "spar");
  document.getElementById("setBg").value = String(S.bg);
  document.getElementById("setBg").addEventListener("change", e => settBakgrunn(e.target.value === "1"));
  kobleValg("setFog", "fog", () => settTaake(S.fog === 1));
  kobleValg("setRate", "rate", () => taake.tegn());
  kobleValg("setSoner", "soner", () => tegnSoner());
  kobleValg("setTrack", "track", () => tegnSpor());
  kobleValg("setYear", "aar", () => { taake.tegn(); tegnMerker(); tegnSoner(); oppdaterHud(); });

  if (nativ) {
    S.wake = 0; S.bg = 0;
    document.getElementById("radWake").style.display = "none";
    document.getElementById("radBg").style.display = "none";
    const st = document.getElementById("nativStatus");
    st.style.display = "";
    st.textContent = "Kjører som app. GPS-en kan være tilgjengelig med låst skjerm; gålinje og tåke registreres bare når en tur er startet og ikke er pauset."
      + (celler.size === 0 ? " Tomt kart? Hent JSON-kopien fra nettversjonen med Importer nederst." : "");
  }

  fyllAar();
  tegnMerker();
  tegnSoner();
  if (S.track) tegnSpor();
  if (spor.length) map.setView([spor[spor.length - 1][0], spor[spor.length - 1][1]], 15);
  document.getElementById("btnTaake").classList.toggle("pa", S.fog === 1);
  visLagringStatus();
  oppdaterTurUI();
  oppdaterHud();
  fyllLister();
  taake.tegn();
  sjekkSol();
  start();
  if (S.wake === 1) settWake(true);
  if (S.bg === 1) {   // lyd krever et trykk først
    const en = () => { startBakgrunn(); document.removeEventListener("pointerdown", en, true); };
    document.addEventListener("pointerdown", en, true);
  }
  setInterval(lagreNa, 30000);
})();
</script>
</body>
</html>
