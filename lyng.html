<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Lyng — blåbærsporing</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" rel="stylesheet" />
<style>
  :root {
    --skygge: #101A16;
    --skygge-2: #1B2A24;
    --lyng: #7B8CC4;
    --lyng-dyp: #3A4A80;
    --mose: #A8C08A;
    --stein: #8A9490;
    --sol: #D9A441;
    --papir: #EDF0EA;
    --fare: #C4614B;
    --rail: 78px;
    --data: ui-monospace, "SF Mono", "Roboto Mono", Menlo, monospace;
    --kond: "Roboto Condensed", "Helvetica Neue", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--skygge); color: var(--papir);
    overscroll-behavior: none;
  }
  #map { position: absolute; inset: 0; background: #cfd6cc; }
  .leaflet-control-attribution {
    background: rgba(16,26,22,.72) !important; color: var(--stein) !important;
    font-size: 9px; padding: 2px 6px; border-radius: 6px 0 0 0;
    margin: 0 0 calc(var(--rail) + 24px) 0 !important;
  }
  .leaflet-control-attribution a { color: var(--stein) !important; }

  /* ---------- toppfelt ---------- */
  .topp {
    position: absolute; top: 0; left: 0; right: 0; z-index: 500;
    padding: 8px 8px 10px;
    background: linear-gradient(180deg, rgba(16,26,22,.93) 55%, rgba(16,26,22,0));
    pointer-events: none;
  }
  .dekning { height: 3px; background: rgba(237,240,234,.14); border-radius: 2px; overflow: hidden; margin-bottom: 8px; }
  .dekning i { display: block; height: 100%; width: 0; background: var(--lyng); transition: width .6s ease; }
  .chips { display: flex; gap: 5px; }
  .chip {
    background: rgba(27,42,36,.92); border: 1px solid rgba(237,240,234,.1);
    border-radius: 10px; padding: 5px 8px; min-width: 0; flex: 1; pointer-events: auto;
  }
  .chip b {
    display: block; font-family: var(--data); font-size: 14px; line-height: 1.15;
    letter-spacing: -.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chip span.et {
    display: block; font-family: var(--kond); font-weight: 700; font-size: 9px;
    letter-spacing: .1em; text-transform: uppercase; color: var(--stein);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chip.sekk b { color: var(--sol); }
  .chip.svak b { color: var(--fare); }
  #sekkPil { display: none; margin-right: 3px; transform-origin: 50% 55%; }

  .stripe {
    margin-top: 8px; pointer-events: auto; border-radius: 10px; padding: 8px 10px;
    font-size: 12.5px; line-height: 1.4; display: none; align-items: center; gap: 8px;
    background: rgba(27,42,36,.94); border: 1px solid rgba(237,240,234,.14);
  }
  .stripe.vis { display: flex; }
  .stripe .tekst { flex: 1; min-width: 0; font-family: var(--data); font-size: 12.5px; }
  .stripe button {
    padding: 7px 10px; border-radius: 8px; cursor: pointer; flex: 0 0 auto;
    border: 1px solid rgba(237,240,234,.2); background: var(--skygge-2); color: var(--papir);
    font-family: var(--kond); font-weight: 700; font-size: 11px;
    text-transform: uppercase; letter-spacing: .05em;
  }
  .stripe button.primar { background: var(--lyng-dyp); border-color: var(--lyng); }
  .stripe button.fare { color: var(--fare); }
  #varsel { background: rgba(196,97,75,.14); border-color: rgba(196,97,75,.5); display: none; }
  #varsel.vis { display: block; }
  #varsel b { color: var(--fare); }
  #solStripe .tekst { color: var(--sol); }
  #solStripe.morkt .tekst { color: var(--fare); }

  /* ---------- knapperad ---------- */
  .rail {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 500;
    padding: 14px 8px 10px;
    background: linear-gradient(0deg, rgba(16,26,22,.94) 62%, rgba(16,26,22,0));
    display: flex; gap: 6px;
  }
  .rail button {
    flex: 1; height: var(--rail); border-radius: 14px; border: 1px solid rgba(237,240,234,.12);
    background: var(--skygge-2); color: var(--papir);
    font-family: var(--kond); font-weight: 700; font-size: 11.5px;
    letter-spacing: .05em; text-transform: uppercase;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    cursor: pointer; transition: transform .1s ease;
  }
  .rail button:active { transform: scale(.94); }
  .rail button .dot { width: 14px; height: 14px; border-radius: 50%; }
  .rail button:focus-visible { outline: 2px solid var(--papir); outline-offset: 2px; }

  .verktoy {
    position: absolute; right: 8px; bottom: calc(var(--rail) + 28px); z-index: 500;
    display: flex; flex-direction: column; gap: 6px;
  }
  .verktoy button {
    width: 42px; height: 42px; border-radius: 12px; border: 1px solid rgba(237,240,234,.12);
    background: rgba(27,42,36,.93); color: var(--papir); font-size: 17px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .verktoy button.pa { background: var(--lyng-dyp); border-color: var(--lyng); }
  .verktoy button:active { transform: scale(.93); }

  /* ---------- bunnark ---------- */
  .ark {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 1100;
    background: var(--skygge-2); border-top: 1px solid rgba(237,240,234,.14);
    border-radius: 18px 18px 0 0; padding: 16px 16px 22px; display: none;
  }
  .ark.apen { display: block; }
  .ark h4 { margin: 0 0 12px; font-family: var(--kond); font-weight: 700; font-size: 15px; text-transform: uppercase; letter-spacing: .06em; }
  .ark .valg { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .ark .valg button {
    padding: 13px 8px; border-radius: 11px; border: 1px solid rgba(237,240,234,.14);
    background: var(--skygge); color: var(--papir); cursor: pointer;
    font-family: var(--kond); font-weight: 700; font-size: 12.5px;
    text-transform: uppercase; letter-spacing: .04em;
    display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  .ark .valg button .dot { width: 12px; height: 12px; border-radius: 50%; }
  .ark input {
    width: 100%; background: var(--skygge); color: var(--papir);
    border: 1px solid rgba(237,240,234,.18); border-radius: 10px; padding: 12px;
    font-size: 16px; font-family: var(--data); margin-bottom: 10px;
  }
  .ark .to { display: flex; gap: 7px; }
  .ark .to button {
    flex: 1; padding: 13px; border-radius: 11px; border: 1px solid rgba(237,240,234,.16);
    background: var(--skygge); color: var(--papir); cursor: pointer;
    font-family: var(--kond); font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .05em;
  }
  .ark .to button.primar { background: var(--lyng-dyp); border-color: var(--lyng); }
  .ark .to button.fare { color: var(--fare); }

  /* ---------- panel ---------- */
  .panel {
    position: absolute; inset: 0; z-index: 1200; background: var(--skygge);
    padding: 20px 18px; overflow-y: auto; display: none;
  }
  .panel.apen { display: block; }
  .panel h2 { font-family: var(--kond); font-weight: 700; font-size: 23px; margin: 0 0 4px; }
  .panel h2 .ver { font-size: 12px; color: var(--stein); font-family: var(--data); font-weight: 500; margin-left: 6px; }
  .panel p.hjelp { color: var(--stein); font-size: 12.5px; margin: 0 0 18px; line-height: 1.5; }
  .rad { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(237,240,234,.09); }
  .rad label { font-size: 14px; }
  .rad small { display: block; color: var(--stein); font-size: 11.5px; margin-top: 2px; }
  .rad select {
    background: var(--skygge-2); color: var(--papir); border: 1px solid rgba(237,240,234,.14);
    border-radius: 9px; padding: 9px 10px; font-family: var(--data); font-size: 14px; min-width: 90px;
  }
  .knapp {
    display: block; width: 100%; margin-top: 9px; padding: 14px; border-radius: 12px;
    border: 1px solid rgba(237,240,234,.16); background: var(--skygge-2); color: var(--papir);
    font-family: var(--kond); font-weight: 700; font-size: 13.5px;
    letter-spacing: .05em; text-transform: uppercase; cursor: pointer;
  }
  .knapp.fare { color: var(--fare); border-color: rgba(196,97,75,.45); }
  .knapp.primar { background: var(--lyng-dyp); border-color: var(--lyng); }
  .seksjon { margin-top: 24px; }
  .seksjon h3 {
    font-family: var(--kond); font-size: 10.5px; font-weight: 700; letter-spacing: .14em;
    text-transform: uppercase; color: var(--stein); margin: 0 0 4px;
  }
  .liste { border-top: 1px solid rgba(237,240,234,.09); }
  .liste .el { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid rgba(237,240,234,.09); font-size: 13px; }
  .liste .el .info { flex: 1; min-width: 0; }
  .liste .el .info b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .liste .el .info small { color: var(--stein); font-family: var(--data); font-size: 11px; }
  .liste .el button {
    padding: 8px 11px; border-radius: 8px; border: 1px solid rgba(237,240,234,.16);
    background: var(--skygge-2); color: var(--papir); font-size: 11px; cursor: pointer;
    font-family: var(--kond); font-weight: 700; text-transform: uppercase;
  }
  .liste .el button.fare { color: var(--fare); }
  .liste .tom { color: var(--stein); font-size: 12.5px; padding: 11px 0; }

  /* ---------- koordinatskjerm ---------- */
  .koord {
    position: absolute; inset: 0; z-index: 1300; background: var(--skygge);
    display: none; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; padding: 24px; cursor: pointer;
  }
  .koord.apen { display: flex; }
  .koord .et { font-family: var(--kond); font-weight: 700; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--stein); margin-bottom: 14px; }
  .koord .stor { font-family: var(--data); font-size: 34px; line-height: 1.35; letter-spacing: -.5px; }
  .koord .ddm { font-family: var(--data); font-size: 17px; color: var(--mose); margin-top: 16px; line-height: 1.5; }
  .koord .noy { font-family: var(--data); font-size: 14px; color: var(--stein); margin-top: 18px; }
  .koord .nod { margin-top: 34px; font-size: 13px; color: var(--fare); font-weight: 600; }
  .koord .lukk { margin-top: 8px; font-size: 11.5px; color: var(--stein); }

  /* ---------- popup ---------- */
  .leaflet-popup-content-wrapper { background: var(--skygge-2); color: var(--papir); border-radius: 12px; }
  .leaflet-popup-tip { background: var(--skygge-2); }
  .leaflet-popup-content { margin: 12px 14px; font-size: 13px; }
  .pop-tit { font-family: var(--kond); font-weight: 700; font-size: 15px; text-transform: uppercase; letter-spacing: .05em; }
  .pop-meta { font-family: var(--data); font-size: 10.5px; color: var(--stein); margin: 5px 0 9px; line-height: 1.6; }
  .pop-felt { display: flex; gap: 6px; margin-bottom: 8px; }
  .pop-felt input {
    flex: 1; min-width: 0; background: var(--skygge); color: var(--papir);
    border: 1px solid rgba(237,240,234,.16); border-radius: 8px; padding: 8px; font-size: 13px;
  }
  .pop-felt input.liter { flex: 0 0 58px; font-family: var(--data); }
  .pop-knapper { display: flex; gap: 6px; flex-wrap: wrap; }
  .pop-knapper button {
    flex: 1 1 45%; padding: 9px 6px; border-radius: 8px; border: 1px solid rgba(237,240,234,.16);
    background: var(--skygge); color: var(--papir); font-size: 11px; cursor: pointer;
    font-family: var(--kond); font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
  }
  .pop-knapper button.slett { color: var(--fare); }

  .puls { width: 16px; height: 16px; border-radius: 50%; background: var(--sol); border: 2px solid var(--papir); animation: puls 1.2s ease-out infinite; }
  @keyframes puls { 0% { box-shadow: 0 0 0 0 rgba(217,164,65,.7); } 100% { box-shadow: 0 0 0 22px rgba(217,164,65,0); } }

  /* ---------- strømsparing ---------- */
  .spar {
    position: absolute; inset: 0; z-index: 2000; background: #000;
    display: none; flex-direction: column; justify-content: space-between; align-items: center;
    padding: 44px 20px; text-align: center; touch-action: none;
    color: #2E3A34; font-family: var(--data);
  }
  .spar.apen { display: flex; }
  .spar .hode { font-size: 9.5px; letter-spacing: .2em; display: flex; align-items: center; gap: 8px; }
  .spar .dot2 { width: 6px; height: 6px; border-radius: 50%; background: #202A24; transition: background .3s; }
  .spar .dot2.blink { background: #6E8C7A; }
  .spar .midt { font-size: 14px; line-height: 2.1; }
  .spar .midt .kl { display: block; font-size: 31px; color: #3E4C44; margin-bottom: 12px; letter-spacing: -1px; }
  .spar .fot { font-size: 9.5px; letter-spacing: .16em; }

  .brod {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); z-index: 1050;
    background: var(--skygge-2); border: 1px solid rgba(237,240,234,.16); border-radius: 12px;
    padding: 13px 18px; font-size: 13.5px; text-align: center; opacity: 0; pointer-events: none;
    transition: opacity .25s ease; max-width: 80vw;
  }
  .brod.vis { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<div id="map"></div>

<div class="topp">
  <div class="dekning"><i id="dekningBar"></i></div>
  <div class="chips">
    <div class="chip" id="chipGps" style="cursor:pointer"><b id="vGps">søker</b><span class="et">nøyaktighet</span></div>
    <div class="chip"><b id="vAreal">0 %</b><span class="et">dekket i synsfelt</span></div>
    <div class="chip"><b id="vDist">0,0</b><span class="et">gått km</span></div>
    <div class="chip sekk" id="chipSekk" style="display:none;cursor:pointer"><b><span id="sekkPil">▲</span><span id="vSekk">—</span></b><span class="et" id="etSekk">til sekken</span></div>
  </div>
  <div class="stripe" id="solStripe"><div class="tekst" id="solTekst"></div></div>
  <div class="stripe" id="benchBar">
    <div class="tekst" id="benchTekst">⏱ 0:00</div>
    <button class="primar" id="btnBenchFerdig">Ferdig</button>
    <button class="fare" id="btnBenchAvbryt">Avbryt</button>
  </div>
  <div class="stripe" id="soneBar">
    <div class="tekst" id="soneTekst">Sone</div>
    <button id="btnSoneAngre">Angre</button>
    <button class="primar" id="btnSoneFerdig">Ferdig</button>
    <button class="fare" id="btnSoneAvbryt">✕</button>
  </div>
  <div class="stripe" id="varsel"><div><b>Ingen GPS.</b> <span id="varselTekst"></span></div></div>
</div>

<div class="verktoy">
  <button id="btnFolg" class="pa" title="Følg posisjon">◎</button>
  <button id="btnTaake" class="pa" title="Tåke av/på">☁</button>
  <button id="btnBench" title="Start måling">⏱</button>
  <button id="btnSone" title="Ny plukksone">⬡</button>
  <button id="btnSpar" title="Strømsparing">◐</button>
  <button id="btnLag" title="Bytt kartlag">▤</button>
  <button id="btnMeny" title="Meny">☰</button>
</div>

<div class="rail">
  <button data-type="funn"><span class="dot" style="background:#7B8CC4"></span>Bær</button>
  <button data-type="senere"><span class="dot" style="background:#A8C08A"></span>Tilbake</button>
  <button data-type="tomt"><span class="dot" style="background:#8A9490"></span>Tomt</button>
  <button data-type="sekk"><span class="dot" style="background:#D9A441"></span>Sekk</button>
</div>

<div class="ark" id="ark"></div>

<div class="koord" id="koord">
  <div class="et">Din posisjon</div>
  <div class="stor" id="koordStor">—</div>
  <div class="ddm" id="koordDdm"></div>
  <div class="noy" id="koordNoy"></div>
  <div class="nod">Ved nød: ring 113 og les opp tallene øverst</div>
  <div class="lukk">Trykk hvor som helst for å lukke</div>
</div>

<div class="panel" id="panel">
  <h2>Innstillinger<span class="ver">v3.1</span></h2>
  <p class="hjelp" id="lagringStatus"></p>
  <p class="hjelp" id="nativStatus" style="display:none"></p>

  <div class="seksjon">
    <h3>Soner</h3>
    <div class="liste" id="soneListe"></div>
  </div>

  <div class="seksjon">
    <h3>Målinger</h3>
    <p class="hjelp" id="benchOppsummering" style="margin-bottom:6px"></p>
    <div class="liste" id="benchListe"></div>
  </div>

  <div class="seksjon">
    <h3>Sporing</h3>
    <div class="rad">
      <label>Rutestørrelse<small>Hvor finmasket tåken lettes</small></label>
      <select id="setGrid"><option value="8">8 m</option><option value="12">12 m</option><option value="20">20 m</option></select>
    </div>
    <div class="rad">
      <label>Synsvidde<small>Radius som ryddes rundt deg</small></label>
      <select id="setRadius"><option value="8">8 m</option><option value="15">15 m</option><option value="25">25 m</option><option value="40">40 m</option></select>
    </div>
    <div class="rad">
      <label>Krev nøyaktighet<small>Dårligere fikser forkastes</small></label>
      <select id="setAcc"><option value="20">20 m</option><option value="35">35 m</option><option value="60">60 m</option><option value="9999">Godta alt</option></select>
    </div>
    <div class="rad" id="radWake">
      <label>Hold skjermen våken<small>Nødvendig for sporing i nettleser</small></label>
      <select id="setWake"><option value="1">På</option><option value="0">Av</option></select>
    </div>
    <div class="rad">
      <label>Strømsparing<small>Svart skjerm når du ikke rører den</small></label>
      <select id="setSpar"><option value="0">Av</option><option value="1">1 min</option><option value="2">2 min</option><option value="5">5 min</option></select>
    </div>
    <div class="rad" id="radBg">
      <label>Hold i bakgrunnen<small>Forsøker å spore med skjermen av</small></label>
      <select id="setBg"><option value="0">Av</option><option value="1">På</option></select>
    </div>
    <p class="hjelp" id="hullTekst" style="margin:12px 0 0"></p>
  </div>

  <div class="seksjon">
    <h3>Vis</h3>
    <div class="rad"><label>Tåke</label><select id="setFog"><option value="1">På</option><option value="0">Av</option></select></div>
    <div class="rad"><label>Plukkerate<small>Farger målte områder etter l/t</small></label><select id="setRate"><option value="1">På</option><option value="0">Av</option></select></div>
    <div class="rad"><label>Soner</label><select id="setSoner"><option value="1">På</option><option value="0">Av</option></select></div>
    <div class="rad"><label>Gålinje</label><select id="setTrack"><option value="1">På</option><option value="0">Av</option></select></div>
    <div class="rad">
      <label>Sesong<small>Lyngen står på samme sted år etter år</small></label>
      <select id="setYear"><option value="alle">Alle år</option></select>
    </div>
  </div>

  <div class="seksjon">
    <h3>Data</h3>
    <p class="hjelp" id="statTekst" style="margin-bottom:10px"></p>
    <button class="knapp" id="btnGpx">Eksporter GPX</button>
    <button class="knapp" id="btnBackup">Lagre sikkerhetskopi (JSON)</button>
    <button class="knapp" id="btnImport">Importer sikkerhetskopi (JSON)</button>
    <button class="knapp fare" id="btnNullstillSpor">Slett dagens gålinje</button>
    <button class="knapp fare" id="btnNullstillAlt">Slett alt</button>
  </div>

  <div class="seksjon">
    <button class="knapp primar" id="btnLukk">Lukk</button>
  </div>
</div>

<div class="spar" id="spar">
  <div class="hode"><span class="dot2" id="sparDot"></span><span>LYNG SPORER</span></div>
  <div class="midt" id="sparInfo"></div>
  <div class="fot">TRYKK TRE GANGER FOR KARTET</div>
</div>

<div class="brod" id="brod"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
"use strict";

/* ============================================================
   1. Tilstand og lagring
   ============================================================ */
const NOKKEL = "lyng:data";
const FARGER = {
  funn:   { farge: "#7B8CC4", navn: "Bær her" },
  senere: { farge: "#A8C08A", navn: "Kom tilbake" },
  tomt:   { farge: "#8A9490", navn: "Tomt" },
  sekk:   { farge: "#D9A441", navn: "Sekken" },
  myr:    { farge: "#5B7A8C", navn: "Myr" },
  kratt:  { farge: "#7A6A4F", navn: "Kratt" },
  bratt:  { farge: "#C4614B", navn: "For bratt" }
};
const standard = {
  grid: 12, radius: 15, acc: 35, wake: 1, fog: 1, track: 1,
  rate: 1, soner: 1, lag: "topo", lat0: null, aar: "alle",
  spar: 2, bg: 0
};

let S = Object.assign({}, standard);
let celler = new Map();      // "x,y" -> siste år
let merker = [];             // {id,type,lat,lng,t,liter,notat}
let soner = [];              // {id,navn,pkt:[[lat,lng]...],t}
let bench = [];              // {id,t0,t1,liter,metode,dist,celler:[],lat,lng}
let spor = [];
let distanse = 0;
let sisteFix = null;
let posisjon = null;
let lagringVirker = null;

function pakk() {
  const perAar = {};
  for (const [k, aar] of celler) (perAar[aar] = perAar[aar] || []).push(k);
  return JSON.stringify({
    S, merker, soner, bench, distanse, hull, celler: perAar,
    spor: spor.map(p => [ +p[0].toFixed(6), +p[1].toFixed(6), p[2] ])
  });
}

async function skrivRaa(t) {
  if (window.storage && window.storage.set) { await window.storage.set(NOKKEL, t); return; }
  localStorage.setItem(NOKKEL, t);
}
async function lesRaa() {
  if (window.storage && window.storage.get) {
    const r = await window.storage.get(NOKKEL);
    return r ? r.value : null;
  }
  return localStorage.getItem(NOKKEL);
}

let sisteLagring = 0, ventende = false;
async function lagreNa() {
  try {
    await skrivRaa(pakk());
    sisteLagring = Date.now();
    if (lagringVirker !== true) { lagringVirker = true; visLagringStatus(); }
  } catch (e) {
    if (lagringVirker !== false) { lagringVirker = false; visLagringStatus(); }
  }
}
function lagre() {
  const naa = Date.now();
  if (naa - sisteLagring > 15000) { lagreNa(); return; }
  if (ventende) return;
  ventende = true;
  setTimeout(() => { ventende = false; lagreNa(); }, 15000 - (naa - sisteLagring));
}

function visLagringStatus() {
  document.getElementById("lagringStatus").textContent = lagringVirker === false
    ? "Kan ikke lagre her. Turen finnes bare så lenge fanen er åpen — ta GPX-eksport før du lukker."
    : "Tåken forsvinner der du har gått. Alt lagres på enheten din.";
}

async function lastInn() {
  let raa = null;
  try { raa = await lesRaa(); } catch (e) { raa = null; }
  if (!raa) return;
  try {
    const d = JSON.parse(raa);
    S = Object.assign({}, standard, d.S || {});
    merker = d.merker || [];
    for (const m of merker) if (m.type === "bil") m.type = "sekk";  // gammelt navn
    soner = d.soner || [];
    bench = d.bench || [];
    spor = d.spor || [];
    hull = d.hull || [];
    distanse = d.distanse || 0;
    celler = new Map();
    for (const aar in (d.celler || {})) for (const k of d.celler[aar]) celler.set(k, +aar);
  } catch (e) { /* ødelagt lagring — start blankt */ }
}

/* ============================================================
   2. Geometri: rutenett, polygon, forenkling
   ============================================================ */
const MERC = L.CRS.EPSG3857;

function cellStorrelse() {
  const lat = S.lat0 == null ? 59.5 : S.lat0;
  return S.grid / Math.cos(lat * Math.PI / 180);
}

function merkBesokt(lat, lng, radius) {
  const cs = cellStorrelse();
  const rM = radius / Math.cos((S.lat0 == null ? lat : S.lat0) * Math.PI / 180);
  const p = MERC.project(L.latLng(lat, lng));
  const x0 = Math.floor((p.x - rM) / cs), x1 = Math.floor((p.x + rM) / cs);
  const y0 = Math.floor((p.y - rM) / cs), y1 = Math.floor((p.y + rM) / cs);
  const aar = new Date().getFullYear();
  for (let x = x0; x <= x1; x++) {
    for (let y = y0; y <= y1; y++) {
      const sx = (x + 0.5) * cs - p.x, sy = (y + 0.5) * cs - p.y;
      if (sx * sx + sy * sy > rM * rM) continue;
      const k = x + "," + y;
      celler.set(k, aar);
      if (benchAktiv) benchAktiv.celler.add(k);
    }
  }
}

function cellSenter(k) {
  const i = k.indexOf(",");
  const cs = cellStorrelse();
  return MERC.unproject(L.point((+k.slice(0, i) + 0.5) * cs, (+k.slice(i + 1) + 0.5) * cs));
}

// stråletest, lat/lng rett fram — små områder, godt nok
function iPolygon(lat, lng, pkt) {
  let inne = false;
  for (let i = 0, j = pkt.length - 1; i < pkt.length; j = i++) {
    const yi = pkt[i][0], xi = pkt[i][1], yj = pkt[j][0], xj = pkt[j][1];
    if ((yi > lat) !== (yj > lat) && lng < (xj - xi) * (lat - yi) / (yj - yi) + xi) inne = !inne;
  }
  return inne;
}

// Ramer–Douglas–Peucker i mercator-meter
function forenkle(pkt, tolM) {
  if (pkt.length < 4) return pkt.slice();
  const P = pkt.map(p => MERC.project(L.latLng(p[0], p[1])));
  const behold = new Array(P.length).fill(false);
  behold[0] = behold[P.length - 1] = true;
  const stakk = [[0, P.length - 1]];
  while (stakk.length) {
    const [a, b] = stakk.pop();
    let maks = 0, mi = -1;
    const ax = P[a].x, ay = P[a].y, dx = P[b].x - ax, dy = P[b].y - ay;
    const len2 = dx * dx + dy * dy || 1e-9;
    for (let i = a + 1; i < b; i++) {
      const t = Math.max(0, Math.min(1, ((P[i].x - ax) * dx + (P[i].y - ay) * dy) / len2));
      const ex = ax + t * dx - P[i].x, ey = ay + t * dy - P[i].y;
      const d = Math.sqrt(ex * ex + ey * ey);
      if (d > maks) { maks = d; mi = i; }
    }
    if (maks > tolM && mi > 0) { behold[mi] = true; stakk.push([a, mi], [mi, b]); }
  }
  return pkt.filter((_, i) => behold[i]);
}

function polySenter(pkt) {
  let la = 0, ln = 0;
  for (const p of pkt) { la += p[0]; ln += p[1]; }
  return [la / pkt.length, ln / pkt.length];
}

/* ---- tåke + plukkerate på samme canvas ---- */
const Taake = L.Layer.extend({
  onAdd(m) {
    this._map = m;
    this._c = L.DomUtil.create("canvas");
    this._c.style.position = "absolute";
    this._c.style.pointerEvents = "none";
    m.getPanes().overlayPane.appendChild(this._c);
    m.on("move resize viewreset", this._kanskjePlasser, this);
    m.on("zoomanim", this._animer, this);
    m.on("zoomend", this._avsluttAnim, this);
    this._plasser();
  },
  _animer(e) {
    this._animerer = true;
    const skala = this._map.getZoomScale(e.zoom, this._zoom);
    const halv = this._map.getSize().multiplyBy(0.5);
    const senter = this._map.project(this._center, e.zoom);
    const hjorne = halv.multiplyBy(-skala).add(senter)
      .subtract(this._map._getNewPixelOrigin(e.center, e.zoom));
    L.DomUtil.setTransform(this._c, hjorne, skala);
  },
  _kanskjePlasser() { if (!this._animerer) this._plasser(); },
  _avsluttAnim() { this._animerer = false; this._plasser(); },
  _plasser() {
    if (!this._map) return;
    const st = this._map.getSize();
    this._center = this._map.getCenter();
    this._zoom = this._map.getZoom();
    L.DomUtil.setPosition(this._c, this._map.containerPointToLayerPoint([0, 0]));
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (this._c.width !== Math.round(st.x * dpr)) {
      this._c.width = Math.round(st.x * dpr);
      this._c.height = Math.round(st.y * dpr);
      this._c.style.width = st.x + "px";
      this._c.style.height = st.y + "px";
    }
    this.tegn();
  },
  tegn() {
    if (!this._map || !this._c) return;
    const ctx = this._c.getContext("2d");
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const st = this._map.getSize();
    ctx.filter = "none";
    ctx.globalCompositeOperation = "source-over";
    ctx.clearRect(0, 0, st.x, st.y);

    const cs = cellStorrelse();
    const b = this._map.getBounds().pad(0.12);
    const sv = MERC.project(b.getSouthWest());
    const no = MERC.project(b.getNorthEast());
    const xMin = Math.floor(sv.x / cs) - 1, xMax = Math.floor(no.x / cs) + 1;
    const yMin = Math.floor(sv.y / cs) - 1, yMax = Math.floor(no.y / cs) + 1;
    const filterAar = S.aar === "alle" ? null : +S.aar;
    const rekt = k => {
      const i = k.indexOf(",");
      const cx = +k.slice(0, i), cy = +k.slice(i + 1);
      if (cx < xMin || cx > xMax || cy < yMin || cy > yMax) return null;
      const nv = this._map.latLngToContainerPoint(MERC.unproject(L.point(cx * cs, (cy + 1) * cs)));
      const so = this._map.latLngToContainerPoint(MERC.unproject(L.point((cx + 1) * cs, cy * cs)));
      return [nv.x, nv.y, so.x - nv.x, so.y - nv.y];
    };

    if (S.fog) {
      ctx.fillStyle = "rgba(16,26,22,0.74)";
      ctx.fillRect(0, 0, st.x, st.y);
      ctx.globalCompositeOperation = "destination-out";
      ctx.filter = "blur(5px)";
      ctx.fillStyle = "#000";
      for (const [k, aar] of celler) {
        if (filterAar !== null && aar !== filterAar) continue;
        const r = rekt(k);
        if (r) ctx.fillRect(r[0] - 1, r[1] - 1, r[2] + 2, r[3] + 2);
      }
      ctx.filter = "none";
      ctx.globalCompositeOperation = "source-over";
    }

    if (S.rate && bench.length) {
      const med = medianRate(filterAar);
      for (const bm of bench) {
        if (filterAar !== null && new Date(bm.t0).getFullYear() !== filterAar) continue;
        ctx.fillStyle = rateFarge(rateLT(bm), med);
        for (const k of bm.celler) {
          const r = rekt(k);
          if (r) ctx.fillRect(r[0], r[1], r[2] + 0.5, r[3] + 0.5);
        }
      }
    }
  }
});
const taake = new Taake();
map.addLayer(taake);

const sporLinje = L.polyline([], { color: "#7B8CC4", weight: 2.5, opacity: .85 }).addTo(map);
const posSirkel = L.circleMarker([0, 0], { radius: 8, color: "#EDF0EA", weight: 3, fillColor: "#3A4A80", fillOpacity: 1 });
const noySirkel = L.circle([0, 0], { radius: 0, color: "#7B8CC4", weight: 1, fillOpacity: .07 });

/* ============================================================
   4. Benchmark
   ============================================================ */
let benchAktiv = null, benchTimer = null;

function rateLT(b) { return b.liter / Math.max(1 / 60, (b.t1 - b.t0) / 3600000); }
function rate100(b) { return b.dist >= 20 ? b.liter / (b.dist / 100) : null; }
function medianRate(filterAar) {
  const r = bench
    .filter(b => filterAar == null || new Date(b.t0).getFullYear() === filterAar)
    .map(rateLT).sort((a, b) => a - b);
  if (!r.length) return 0;
  return r.length % 2 ? r[(r.length - 1) / 2] : (r[r.length / 2 - 1] + r[r.length / 2]) / 2;
}
function rateFarge(r, med) {
  if (med <= 0) return "rgba(217,164,65,.30)";
  if (r < med * 0.7) return "rgba(196,97,75,.30)";
  if (r > med * 1.3) return "rgba(123,140,196,.40)";
  return "rgba(217,164,65,.30)";
}
const fmt1 = v => v.toFixed(1).replace(".", ",");

function startBench() {
  if (benchAktiv) return;
  visArk(`<h4>Ny måling — hvordan plukker du?</h4>
    <div class="valg">
      <button id="akHand">Hånd</button>
      <button id="akPlukker">Bærplukker</button>
    </div>`);
  document.getElementById("akHand").onclick = () => benchIgang("hånd");
  document.getElementById("akPlukker").onclick = () => benchIgang("bærplukker");
}

function benchIgang(metode) {
  lukkArk();
  benchAktiv = { t0: Date.now(), metode, celler: new Set(), dist0: distanse };
  document.getElementById("btnBench").classList.add("pa");
  document.getElementById("benchBar").classList.add("vis");
  benchTimer = setInterval(oppdaterBenchBar, 1000);
  oppdaterBenchBar();
  melding("Måling i gang — plukk!");
}

function oppdaterBenchBar() {
  if (!benchAktiv) return;
  const s = Math.floor((Date.now() - benchAktiv.t0) / 1000);
  const mm = Math.floor(s / 60), ss = String(s % 60).padStart(2, "0");
  const d = Math.round(distanse - benchAktiv.dist0);
  document.getElementById("benchTekst").textContent = `⏱ ${mm}:${ss} · ${d} m · ${benchAktiv.metode}`;
}

function ferdigBench() {
  if (!benchAktiv) return;
  visArk(`<h4>Hvor mye ble det?</h4>
    <input id="akLiter" type="text" inputmode="decimal" placeholder="liter, f.eks. 1,5">
    <div class="to">
      <button class="fare" id="akForkast">Forkast</button>
      <button class="primar" id="akLagre">Lagre</button>
    </div>`);
  const inp = document.getElementById("akLiter");
  inp.focus();
  document.getElementById("akForkast").onclick = () => { avsluttBench(); lukkArk(); melding("Måling forkastet"); };
  document.getElementById("akLagre").onclick = () => {
    const liter = parseFloat(String(inp.value).replace(",", "."));
    if (isNaN(liter) || liter < 0) { inp.style.borderColor = "var(--fare)"; return; }
    const cellerArr = [...benchAktiv.celler];
    let lat, lng;
    if (cellerArr.length) {
      let la = 0, ln = 0;
      for (const k of cellerArr) { const c = cellSenter(k); la += c.lat; ln += c.lng; }
      lat = la / cellerArr.length; lng = ln / cellerArr.length;
    } else {
      const p = posisjon || map.getCenter();
      lat = p.lat; lng = p.lng;
    }
    const b = {
      id: Date.now().toString(36), t0: benchAktiv.t0, t1: Date.now(),
      liter, metode: benchAktiv.metode,
      dist: Math.max(0, Math.round(distanse - benchAktiv.dist0)),
      celler: cellerArr, lat, lng
    };
    bench.push(b);
    avsluttBench(); lukkArk(); lagreNa(); taake.tegn(); oppdaterHud();
    const r1 = rate100(b);
    melding(`${fmt1(rateLT(b))} l/t` + (r1 != null ? ` · ${fmt1(r1)} l/100 m` : ""), 3500);
  };
}

function avsluttBench() {
  benchAktiv = null;
  clearInterval(benchTimer);
  document.getElementById("btnBench").classList.remove("pa");
  document.getElementById("benchBar").classList.remove("vis");
}

document.getElementById("btnBench").addEventListener("click", () => benchAktiv ? ferdigBench() : startBench());
document.getElementById("btnBenchFerdig").addEventListener("click", ferdigBench);
document.getElementById("btnBenchAvbryt").addEventListener("click", () => { avsluttBench(); melding("Måling avbrutt"); });

let soneModus = null; // {modus:'tegn'|'gaa', pkt:[], harSpurt:false}

function startSone() {
  if (soneModus) return;
  visArk(`<h4>Ny plukksone</h4>
    <div class="valg">
      <button id="akTegn">Trykk hjørner på kartet</button>
      <button id="akGaa">Gå grensa selv</button>
    </div>`);
  document.getElementById("akTegn").onclick = () => { lukkArk(); soneIgang("tegn"); };
  document.getElementById("akGaa").onclick = () => { lukkArk(); soneIgang("gaa"); };
}

function soneIgang(modus) {
  soneModus = { modus, pkt: [], harSpurt: false };
  document.getElementById("btnSone").classList.add("pa");
  document.getElementById("soneBar").classList.add("vis");
  document.getElementById("btnSoneAngre").style.display = modus === "tegn" ? "" : "none";
  oppdaterSoneBar();
  melding(modus === "tegn" ? "Trykk der hjørnene skal stå" : "Gå grensa — jeg følger etter");
}

function oppdaterSoneBar() {
  if (!soneModus) return;
  document.getElementById("soneTekst").textContent =
    (soneModus.modus === "tegn" ? "⬡ Hjørner: " : "⬡ Grensepunkter: ") + soneModus.pkt.length;
  soneSkisse.clearLayers();
  if (soneModus.pkt.length) {
    L.polyline(soneModus.pkt, { color: "#A8C08A", weight: 3, dashArray: "5 6" }).addTo(soneSkisse);
    L.circleMarker(soneModus.pkt[0], { radius: 8, color: "#A8C08A", weight: 3, fillColor: "#101A16", fillOpacity: 1 }).addTo(soneSkisse);
    if (soneModus.pkt.length >= 3)
      L.polyline([soneModus.pkt[soneModus.pkt.length - 1], soneModus.pkt[0]],
        { color: "#A8C08A", weight: 1.5, dashArray: "2 7", opacity: .7 }).addTo(soneSkisse);
  }
}

function soneLeggTil(lat, lng) {
  const pkt = soneModus.pkt;
  // autolukk: nær startpunktet etter å ha vært unna
  if (pkt.length >= 3 && map.distance([lat, lng], pkt[0]) < 20) {
    if (soneModus.modus === "tegn") { ferdigSone(); return; }
    if (!soneModus.harSpurt && soneVeiLengde() > 60) {
      soneModus.harSpurt = true;
      visArk(`<h4>Du er ved startpunktet</h4>
        <div class="to">
          <button id="akFortsett">Fortsett å gå</button>
          <button class="primar" id="akLukkSone">Lukk sonen her</button>
        </div>`);
      document.getElementById("akFortsett").onclick = lukkArk;
      document.getElementById("akLukkSone").onclick = () => { lukkArk(); ferdigSone(); };
    }
  }
  if (soneModus.modus === "gaa" && pkt.length) {
    if (map.distance([lat, lng], pkt[pkt.length - 1]) < 4) return; // stå-stille-støy
  }
  pkt.push([lat, lng]);
  oppdaterSoneBar();
}

function soneVeiLengde() {
  let s = 0;
  const p = soneModus.pkt;
  for (let i = 1; i < p.length; i++) s += map.distance(p[i - 1], p[i]);
  return s;
}

function ferdigSone() {
  if (!soneModus || soneModus.pkt.length < 3) { melding("Trenger minst tre punkter"); return; }
  // lukkes automatisk med rett strek fra siste til første; forenkle sikksakk
  const pkt = forenkle(soneModus.pkt, soneModus.modus === "gaa" ? 4 : 1);
  if (pkt.length < 3) { melding("Sonen ble for liten"); return; }
  avbrytSone(true);
  visArk(`<h4>Navn på sonen</h4>
    <input id="akNavn" type="text" value="Sone ${soner.length + 1}">
    <div class="to">
      <button class="fare" id="akForkast">Forkast</button>
      <button class="primar" id="akLagre">Lagre</button>
    </div>`);
  const inp = document.getElementById("akNavn");
  inp.select();
  document.getElementById("akForkast").onclick = lukkArk;
  document.getElementById("akLagre").onclick = () => {
    soner.push({ id: Date.now().toString(36), navn: inp.value.trim() || `Sone ${soner.length + 1}`, pkt, t: Date.now() });
    lukkArk(); lagreNa(); tegnSoner(); oppdaterHud();
    melding("Sone lagret");
  };
}

function avbrytSone(stille) {
  soneModus = null;
  soneSkisse.clearLayers();
  document.getElementById("btnSone").classList.remove("pa");
  document.getElementById("soneBar").classList.remove("vis");
  if (!stille) melding("Sone avbrutt");
}

document.getElementById("btnSone").addEventListener("click", () => soneModus ? ferdigSone() : startSone());
document.getElementById("btnSoneFerdig").addEventListener("click", ferdigSone);
document.getElementById("btnSoneAvbryt").addEventListener("click", () => avbrytSone(false));
document.getElementById("btnSoneAngre").addEventListener("click", () => {
  if (soneModus && soneModus.pkt.length) { soneModus.pkt.pop(); oppdaterSoneBar(); }
});

/* ---- sonestatistikk ---- */
function soneStat(s) {
  const cs = cellStorrelse();
  let laMin = 90, laMax = -90, lnMin = 180, lnMax = -180;
  for (const p of s.pkt) {
    laMin = Math.min(laMin, p[0]); laMax = Math.max(laMax, p[0]);
    lnMin = Math.min(lnMin, p[1]); lnMax = Math.max(lnMax, p[1]);
  }
  const sv = MERC.project(L.latLng(laMin, lnMin));
  const no = MERC.project(L.latLng(laMax, lnMax));
  let tot = 0, dekt = 0;
  const filterAar = S.aar === "alle" ? null : +S.aar;
  for (let x = Math.floor(sv.x / cs); x <= Math.floor(no.x / cs); x++) {
    for (let y = Math.floor(sv.y / cs); y <= Math.floor(no.y / cs); y++) {
      const c = MERC.unproject(L.point((x + 0.5) * cs, (y + 0.5) * cs));
      if (!iPolygon(c.lat, c.lng, s.pkt)) continue;
      tot++;
      const aar = celler.get(x + "," + y);
      if (aar != null && (filterAar === null || aar === filterAar)) dekt++;
    }
  }
  const iAar = new Date().getFullYear();
  let literIAar = 0, literTot = 0;
  for (const m of merker) {
    if (!m.liter || !iPolygon(m.lat, m.lng, s.pkt)) continue;
    literTot += m.liter;
    if (new Date(m.t).getFullYear() === iAar) literIAar += m.liter;
  }
  const maal = [];
  for (const b of bench) {
    if (!iPolygon(b.lat, b.lng, s.pkt)) continue;
    literTot += b.liter;
    if (new Date(b.t0).getFullYear() === iAar) literIAar += b.liter;
    maal.push(rateLT(b));
  }
  return {
    tot, dekt, pst: tot ? Math.round(dekt / tot * 100) : 0,
    daa: tot * S.grid * S.grid / 1000,
    literIAar, literTot, maal: maal.sort((a, b) => a - b)
  };
}

function narmesteUdekte(s) {
  const cs = cellStorrelse();
  const fra = posisjon || map.getCenter();
  let laMin = 90, laMax = -90, lnMin = 180, lnMax = -180;
  for (const p of s.pkt) {
    laMin = Math.min(laMin, p[0]); laMax = Math.max(laMax, p[0]);
    lnMin = Math.min(lnMin, p[1]); lnMax = Math.max(lnMax, p[1]);
  }
  const sv = MERC.project(L.latLng(laMin, lnMin));
  const no = MERC.project(L.latLng(laMax, lnMax));
  let best = null, bestD = Infinity;
  for (let x = Math.floor(sv.x / cs); x <= Math.floor(no.x / cs); x++) {
    for (let y = Math.floor(sv.y / cs); y <= Math.floor(no.y / cs); y++) {
      if (celler.has(x + "," + y)) continue;
      const c = MERC.unproject(L.point((x + 0.5) * cs, (y + 0.5) * cs));
      if (!iPolygon(c.lat, c.lng, s.pkt)) continue;
      const d = map.distance(fra, c);
      if (d < bestD) { bestD = d; best = c; }
    }
  }
  return best ? { latlng: best, d: bestD } : null;
}

function tegnSoner() {
  soneLag.clearLayers();
  if (!S.soner) return;
  for (const s of soner) {
    const pg = L.polygon(s.pkt, {
      color: "#A8C08A", weight: 2, dashArray: "6 5",
      fillColor: "#A8C08A", fillOpacity: 0.06
    }).addTo(soneLag);
    pg.bindPopup(() => sonePopupHtml(s), { closeButton: false, minWidth: 215 });
    pg.on("popupopen", () => kobleSonePopup(s));
  }
}

function sonePopupHtml(s) {
  const st = soneStat(s);
  const maal = st.maal.length
    ? `${st.maal.length} ${st.maal.length === 1 ? "måling" : "målinger"}: ${fmt1(st.maal[0])}–${fmt1(st.maal[st.maal.length - 1])} l/t`
    : "Ingen målinger ennå";
  return `<div class="pop-tit" style="color:#A8C08A">${escHtml(s.navn)}</div>
    <div class="pop-meta">${fmt1(st.daa)} daa · ${st.pst} % dekket<br>
    I år: ${fmt1(st.literIAar)} l · Totalt: ${fmt1(st.literTot)} l<br>${maal}</div>
    <div class="pop-knapper">
      <button id="su-${s.id}">Nærmeste udekte</button>
      <button id="sn-${s.id}">Nytt navn</button>

}

function kobleSonePopup(s) {
  const ud = document.getElementById("su-" + s.id);

    setTimeout(() => { if (pulsMarkor) { map.removeLayer(pulsMarkor); pulsMarkor = null; } }, 45000);
    const fra = posisjon || map.getCenter();
    melding(`Udekt område ${Math.round(t.d)} m ${HIMMEL[Math.round(peiling(fra, t.latlng) / 45) % 8]}`, 3500);
  };
  if (nn) nn.onclick = () => {
    map.closePopup();
    visArk(`<h4>Nytt navn</h4>

    const inp = document.getElementById("akNavn"); inp.select();

}

/* ============================================================
   6. Merker
   ============================================================ */
function escHtml(s) { return String(s || "").replace(/[<>&"]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[c])); }

function tegnMerker() {
  merkeLag.clearLayers();
  const filterAar = S.aar === "alle" ? null : +S.aar;
  for (const m of merker) {
    if (filterAar !== null && new Date(m.t).getFullYear() !== filterAar) continue;
    const f = FARGER[m.type] || FARGER.funn;
    const mk = L.circleMarker([m.lat, m.lng], {
      radius: m.type === "sekk" ? 9 : 7, color: "#101A16", weight: 2,
      fillColor: f.farge, fillOpacity: 1
    }).addTo(merkeLag);
    mk.bindPopup(() => popupHtml(m), { closeButton: false, minWidth: 205 });
    mk.on("popupopen", () => koblePopup(m));
  }
}

function popupHtml(m) {
  const f = FARGER[m.type] || FARGER.funn;
  const d = new Date(m.t);
  const dato = d.toLocaleDateString("no-NO", { day: "2-digit", month: "short", year: "numeric" });
  const kl = d.toLocaleTimeString("no-NO", { hour: "2-digit", minute: "2-digit" });
  return `<div class="pop-tit" style="color:${f.farge}">${f.navn}</div>
    <div class="pop-meta">${dato} kl ${kl}<br>${m.lat.toFixed(5)}, ${m.lng.toFixed(5)}</div>
    <div class="pop-felt">
      <input class="liter" id="pl-${m.id}" type="text" inputmode="decimal" placeholder="ltr" value="${m.liter != null ? String(m.liter).replace(".", ",") : ""}">
      <input id="pn-${m.id}" type="text" placeholder="Notat" value="${escHtml(m.notat)}">
    </div>
    <div class="pop-knapper">
      <button id="pd-${m.id}" class="slett">Slett</button>
      <button id="pk-${m.id}">Lagre</button>
    </div>`;
}

function koblePopup(m) {
  const li = document.getElementById("pl-" + m.id);
  const no = document.getElementById("pn-" + m.id);
  const kn = document.getElementById("pk-" + m.id);
  const sl = document.getElementById("pd-" + m.id);
  if (kn) kn.onclick = () => {
    m.liter = li && li.value.trim() !== "" ? parseFloat(li.value.replace(",", ".")) : null;
    if (m.liter != null && isNaN(m.liter)) m.liter = null;
    m.notat = no ? no.value : "";
    lagreNa(); map.closePopup(); oppdaterHud();
  };
  if (sl) sl.onclick = () => {
    merker = merker.filter(x => x.id !== m.id);
    lagreNa(); map.closePopup(); tegnMerker(); oppdaterHud();
  };

function nyttMerke(type, punkt) {
  const p = punkt || posisjon || map.getCenter();
  if (type === "sekk") merker = merker.filter(x => x.type !== "sekk");
  merker.push({ id: Date.now().toString(36), type, lat: p.lat, lng: p.lng, t: Date.now(), liter: null, notat: "" });
  lagreNa(); tegnMerker(); oppdaterHud(); fyllAar();
  melding((FARGER[type] || FARGER.funn).navn + (punkt || posisjon ? "" : " — satt på kartmidten"));
  if (type === "sekk" && !sekkHintVist) {
    sekkHintVist = true;
    setTimeout(() => melding("Tips: trykk på sekkechipen øverst for retur langs sporet", 3500), 2300);
  }
}
let sekkHintVist = false;

/* ============================================================
   7. GPS
   ============================================================ */
let folg = true, wake = null, gpsSvarte = false;

function start() {
  if (nativ) return startNativ();
  if (!navigator.geolocation) return ingenGps("Nettleseren tilbyr ikke posisjon.");
  posSirkel.addTo(map); noySirkel.addTo(map);
  navigator.geolocation.watchPosition(fix, feil, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
  setTimeout(() => { if (!gpsSvarte) ingenGps("Fikk ikke svar innen 25 sekunder."); }, 25000);
}

function ingenGps(hvorfor) {
  document.getElementById("chipGps").classList.add("svak");
  document.getElementById("vGps").textContent = "av";
  document.getElementById("varselTekst").textContent =
    hvorfor + " Sjekk at posisjon er tillatt for siden, og at stedstjenester er på i telefonen.";
  document.getElementById("varsel").classList.add("vis");
  folg = false;
  document.getElementById("btnFolg").classList.remove("pa");
}

function feil(e) {
  if (e.code === 1) ingenGps("Posisjon er avslått.");
  else if (!gpsSvarte) ingenGps("Finner ikke signal.");
  else document.getElementById("vGps").textContent = "søker";
}

function fix(pos) {
  gpsSvarte = true;
  const naa = Date.now();
  if (!nativ && sisteFixTid && naa - sisteFixTid > 90000) {
    hull.push({ t: sisteFixTid, sek: Math.round((naa - sisteFixTid) / 1000) });
    if (hull.length > 80) hull.shift();
  }
  sisteFixTid = naa;
  const { latitude: lat, longitude: lng, accuracy: acc } = pos.coords;
  posisjon = L.latLng(lat, lng);
  posisjon.acc = acc;
  if (S.lat0 == null) S.lat0 = lat;
  if (sparPa) blink();

  if (!stille()) {
    document.getElementById("varsel").classList.remove("vis");
    document.getElementById("chipGps").classList.toggle("svak", acc > S.acc);
    document.getElementById("vGps").textContent = "± " + Math.round(acc) + " m";
    posSirkel.setLatLng([lat, lng]);
    noySirkel.setLatLng([lat, lng]).setRadius(acc);
    if (folg) map.setView([lat, lng], Math.max(map.getZoom(), 16), { animate: true });
    oppdaterKoord();
  }
  if (acc > S.acc) return;

  if (soneModus && soneModus.modus === "gaa") soneLeggTil(lat, lng);

  if (sisteFix) {
    const d = map.distance(sisteFix, [lat, lng]);
    if (d < 2) return;
    if (d < 200) distanse += d;
  }
  sisteFix = L.latLng(lat, lng);
  spor.push([lat, lng, naa]);
  merkBesokt(lat, lng, S.radius);
  if (stille()) {
    oppdaterSpar();
  } else {
    if (S.track) sporLinje.addLatLng([lat, lng]);
    taake.tegn();
    oppdaterHud();
  }
  lagre();
}

async function settWake(pa) {
  try {
    if (pa && "wakeLock" in navigator) {
      wake = await navigator.wakeLock.request("screen");
      wake.addEventListener("release", () => { wake = null; });
    } else if (wake) { await wake.release(); wake = null; }
  } catch (e) { /* nektet */ }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    if (S.wake === 1 && !wake) settWake(true);
    if (!sparPa) gjenopprettKart();
  } else lagreNa();
});

/* ---- Native bro: Capacitor med bakgrunnstjeneste ---- */
const CAPX = window.Capacitor;
const nativ = !!(CAPX && CAPX.isNativePlatform && CAPX.isNativePlatform() &&
                 CAPX.isPluginAvailable && CAPX.isPluginAvailable("BackgroundGeolocation"));
let bgId = null;

function startNativ() {
  posSirkel.addTo(map); noySirkel.addTo(map);
  try {
    bgId = CAPX.nativeCallback("BackgroundGeolocation", "addWatcher", {
      backgroundTitle: "Lyng sporer turen",
      backgroundMessage: "Trykk for å åpne kartet",
      requestPermissions: true,
      stale: false,
      distanceFilter: 5
    }, (loc, e) => {
      if (e) {
        ingenGps(e.code === "NOT_AUTHORIZED"
          ? "Appen mangler tillatelse til posisjon. Gi den «Tillat hele tiden» i Android-innstillingene."
          : (e.message || "Ukjent posisjonsfeil."));
        return;
      }
      if (!loc || loc.latitude == null) return;
      fix({ coords: { latitude: loc.latitude, longitude: loc.longitude, accuracy: loc.accuracy } });
    });
  } catch (err) {
    ingenGps("Fikk ikke startet bakgrunnssporingen.");
  }
}

/* ============================================================
   8. Kompass, retur og HUD
   ============================================================ */
const HIMMEL = ["N", "NØ", "Ø", "SØ", "S", "SV", "V", "NV"];
function peiling(a, b) {
  const t1 = a.lat * Math.PI / 180, t2 = b.lat * Math.PI / 180;
  const dl = (b.lng - a.lng) * Math.PI / 180;
  return (Math.atan2(Math.sin(dl) * Math.cos(t2),
    Math.cos(t1) * Math.sin(t2) - Math.sin(t1) * Math.cos(t2) * Math.cos(dl)) * 180 / Math.PI + 360) % 360;
}

let heading = null, harAbsolutt = false, retur = false;
function onOri(e, abs) {
  if (e.alpha == null) return;
  if (abs) harAbsolutt = true;
  else if (harAbsolutt || e.absolute !== true) return;
  heading = (360 - e.alpha) % 360;
  oppdaterPil();
}
window.addEventListener("deviceorientationabsolute", e => onOri(e, true), true);
window.addEventListener("deviceorientation", e => onOri(e, false), true);

let pilVenter = false;
function oppdaterPil() {
  if (pilVenter) return;
  pilVenter = true;
  requestAnimationFrame(() => {
    pilVenter = false;
    const pil = document.getElementById("sekkPil");
    const sekk = merker.find(m => m.type === "sekk");
    if (heading == null || !sekk || !posisjon) { pil.style.display = "none"; return; }
    pil.style.display = "inline-block";
    pil.style.transform = `rotate(${(peiling(posisjon, sekk) - heading + 360) % 360}deg)`;
  });
}

function sporTilStart() {
  if (!posisjon || spor.length < 2) return null;
  let ni = 0, nd = Infinity;
  for (let i = 0; i < spor.length; i++) {
    const d = map.distance(posisjon, [spor[i][0], spor[i][1]]);
    if (d < nd) { nd = d; ni = i; }
  }
  let sum = nd;
  for (let i = ni; i > 0; i--) sum += map.distance([spor[i][0], spor[i][1]], [spor[i - 1][0], spor[i - 1][1]]);
  const sekk = merker.find(m => m.type === "sekk");
  if (sekk) sum += map.distance([spor[0][0], spor[0][1]], [sekk.lat, sekk.lng]);
  return sum;
}

document.getElementById("chipSekk").addEventListener("click", () => {
  if (!merker.find(m => m.type === "sekk")) return;
  retur = !retur;
  sporLinje.setStyle({ color: retur ? "#D9A441" : "#7B8CC4", weight: retur ? 5 : 2.5 });
  document.getElementById("etSekk").textContent = retur ? "via sporet" : "til sekken";
  melding(retur ? "Retur: følg den gule linja tilbake" : "Retur av");
  oppdaterHud();
});

function dekningIView() {
  const cs = cellStorrelse();
  const b = map.getBounds();
  const sv = MERC.project(b.getSouthWest());
  const no = MERC.project(b.getNorthEast());
  const xMin = Math.floor(sv.x / cs), xMax = Math.floor(no.x / cs);
  const yMin = Math.floor(sv.y / cs), yMax = Math.floor(no.y / cs);
  const total = (xMax - xMin + 1) * (yMax - yMin + 1);
  if (total <= 0) return 0;
  const filterAar = S.aar === "alle" ? null : +S.aar;
  let n = 0;
  for (const [k, aar] of celler) {
    if (filterAar !== null && aar !== filterAar) continue;
    const i = k.indexOf(",");
    const cx = +k.slice(0, i), cy = +k.slice(i + 1);
    if (cx >= xMin && cx <= xMax && cy >= yMin && cy <= yMax) n++;
  }
  return Math.min(100, (n / total) * 100);
}

function oppdaterHud() {
  document.getElementById("vDist").textContent = fmt1(distanse / 1000);
  const pst = dekningIView();
  document.getElementById("vAreal").textContent = (pst < 10 ? fmt1(pst) : Math.round(pst)) + " %";
  document.getElementById("dekningBar").style.width = pst + "%";

  const sekk = merker.find(m => m.type === "sekk");
  const chip = document.getElementById("chipSekk");
  if (sekk && posisjon) {
    let tekst;
    if (retur) {
      const d = sporTilStart();
      tekst = d == null ? "—" : (d < 1000 ? Math.round(d) + " m" : fmt1(d / 1000) + " km");
    } else {
      const d = map.distance(posisjon, [sekk.lat, sekk.lng]);
      const r = HIMMEL[Math.round(peiling(posisjon, sekk) / 45) % 8];
      tekst = (d < 1000 ? Math.round(d) + " m" : fmt1(d / 1000) + " km") + " " + r;
    }
    document.getElementById("vSekk").textContent = tekst;
    chip.style.display = "";
  } else chip.style.display = "none";
  oppdaterPil();

  const liter = merker.reduce((s, m) => s + (m.liter || 0), 0) + bench.reduce((s, b) => s + b.liter, 0);
  const daa = fmt1(celler.size * S.grid * S.grid / 1000);
  document.getElementById("statTekst").textContent =
    `${daa} daa dekket · ${merker.length} ${merker.length === 1 ? "merke" : "merker"} · ` +
    `${soner.length} ${soner.length === 1 ? "sone" : "soner"} · ${bench.length} ${bench.length === 1 ? "måling" : "målinger"}` +
    (liter ? ` · ${fmt1(liter)} liter` : "");
}

/* ============================================================
   9. Solnedgang
   ============================================================ */
let varslet60 = false, varslet30 = false;

function solnedgang(lat, lng, d) {
  const rad = Math.PI / 180;
  const aar = d.getUTCFullYear();
  const doy = Math.floor((Date.UTC(aar, d.getUTCMonth(), d.getUTCDate()) - Date.UTC(aar, 0, 0)) / 86400000);
  const g = 2 * Math.PI / 365 * (doy - 1 + 0.5);
  const eqt = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g)
    - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
  const dekl = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g)
    - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g)
    - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
  const cosH = (Math.cos(90.833 * rad) - Math.sin(lat * rad) * Math.sin(dekl)) / (Math.cos(lat * rad) * Math.cos(dekl));
  if (cosH < -1 || cosH > 1) return null;   // midnattssol eller mørketid
  const H = Math.acos(cosH) / rad;
  const min = 720 - 4 * (lng - H) - eqt;
  const res = new Date(Date.UTC(aar, d.getUTCMonth(), d.getUTCDate()));
  res.setUTCSeconds(Math.round(min * 60));
  return res;
}

function sjekkSol() {
  const p = posisjon || map.getCenter();
  const ned = solnedgang(p.lat, p.lng, new Date());
  const stripe = document.getElementById("solStripe");
  if (!ned) { stripe.classList.remove("vis"); return; }
  const igjen = (ned - Date.now()) / 60000;
  const kl = ned.toLocaleTimeString("no-NO", { hour: "2-digit", minute: "2-digit" });
  if (igjen <= 180 && igjen > -40) {
    stripe.classList.add("vis");
    stripe.classList.toggle("morkt", igjen <= 0);
    document.getElementById("solTekst").textContent = igjen > 0
      ? `Sol ned ${kl} · ${igjen >= 60 ? Math.floor(igjen / 60) + " t " + Math.round(igjen % 60) + " m" : Math.round(igjen) + " min"} igjen`
      : `Sola gikk ned ${kl}`;
  } else stripe.classList.remove("vis");

  const sekk = merker.find(m => m.type === "sekk");
  const avstand = sekk && posisjon
    ? ` · ${Math.round(map.distance(posisjon, [sekk.lat, sekk.lng]))} m til sekken` : "";
  if (igjen <= 60 && igjen > 55 && !varslet60) { varslet60 = true; melding(`60 min til solnedgang${avstand}`, 4000); }
  if (igjen <= 30 && igjen > 25 && !varslet30) { varslet30 = true; melding(`30 min til solnedgang${avstand}`, 4000); }
}
setInterval(sjekkSol, 60000);

/* ============================================================
   10. Nødkoordinat
   ============================================================ */
function ddm(v, pos, neg) {
  const h = v < 0 ? neg : pos;
  v = Math.abs(v);
  const g = Math.floor(v);
  return `${g}° ${((v - g) * 60).toFixed(3).replace(".", ",")}′ ${h}`;
}
function oppdaterKoord() {
  if (!document.getElementById("koord").classList.contains("apen")) return;
  if (!posisjon) { document.getElementById("koordStor").textContent = "Ingen posisjon"; return; }
  document.getElementById("koordStor").innerHTML =
    posisjon.lat.toFixed(5) + "<br>" + posisjon.lng.toFixed(5);
  document.getElementById("koordDdm").innerHTML =
    ddm(posisjon.lat, "N", "S") + "<br>" + ddm(posisjon.lng, "Ø", "V");
  document.getElementById("koordNoy").textContent = posisjon.acc ? "Nøyaktighet ± " + Math.round(posisjon.acc) + " m" : "";
}
document.getElementById("chipGps").addEventListener("click", () => {
  document.getElementById("koord").classList.add("apen");
  oppdaterKoord();
});
document.getElementById("koord").addEventListener("click", () =>
  document.getElementById("koord").classList.remove("apen"));

/* ============================================================
   10b. Strømsparing og bakgrunn
   ============================================================ */
let sparPa = false, sparTimer = null, sisteAktivitet = Date.now(), tapp = [];
let hull = [], sisteFixTid = 0;
let battNiva = null, battStart = null, battTid = 0;

function stille() { return sparPa || document.hidden; }

if (navigator.getBattery) {
  navigator.getBattery().then(b => {
    battNiva = b.level;
    b.addEventListener("levelchange", () => { battNiva = b.level; });
  }).catch(() => {});
}

function blink() {
  const d = document.getElementById("sparDot");
  if (!d) return;
  d.classList.add("blink");
  setTimeout(() => d.classList.remove("blink"), 500);
}

function visSpar() {
  if (sparPa) return;
  sparPa = true;
  map.closePopup(); lukkArk();
  document.getElementById("spar").classList.add("apen");
  document.getElementById("btnSpar").classList.add("pa");
  battStart = battNiva; battTid = Date.now();
  oppdaterSpar();
  sparTimer = setInterval(oppdaterSpar, 20000);
}

function skjulSpar() {
  if (!sparPa) return;
  sparPa = false;
  clearInterval(sparTimer);
  document.getElementById("spar").classList.remove("apen");
  document.getElementById("btnSpar").classList.remove("pa");
  sisteAktivitet = Date.now();
  gjenopprettKart();
}

function gjenopprettKart() {
  if (posisjon) {
    posSirkel.setLatLng(posisjon);
    noySirkel.setLatLng(posisjon).setRadius(posisjon.acc || 0);
    document.getElementById("vGps").textContent = "± " + Math.round(posisjon.acc || 0) + " m";
    if (folg) map.setView(posisjon, Math.max(map.getZoom(), 16));
  }
  if (S.track) sporLinje.setLatLngs(spor.map(p => [p[0], p[1]]));
  taake.tegn();
  oppdaterHud();
}

function oppdaterSpar() {
  if (!sparPa) return;
  const rader = ['<span class="kl">' + new Date().toLocaleTimeString("no-NO", { hour: "2-digit", minute: "2-digit" }) + "</span>"];
  rader.push(`${fmt1(distanse / 1000)} km · ${fmt1(celler.size * S.grid * S.grid / 1000)} daa`);
  if (benchAktiv) rader.push(`måling ${Math.floor((Date.now() - benchAktiv.t0) / 60000)} min`);
  const p = posisjon || map.getCenter();
  const ned = solnedgang(p.lat, p.lng, new Date());
  if (ned) {
    const min = Math.round((ned - Date.now()) / 60000);
    if (min > 0 && min < 600)
      rader.push("sol ned om " + (min >= 60 ? Math.floor(min / 60) + " t " + (min % 60) + " m" : min + " min"));
  }
  const sekk = merker.find(m => m.type === "sekk");
  if (sekk && posisjon) rader.push(Math.round(map.distance(posisjon, [sekk.lat, sekk.lng])) + " m til sekken");
  if (battNiva != null) {
    let t = Math.round(battNiva * 100) + " %";
    if (battStart != null && battStart > battNiva && Date.now() - battTid > 240000)
      t += " · " + fmt1((battStart - battNiva) * 100 / ((Date.now() - battTid) / 3600000)) + " %/t";
    rader.push(t);
  }
  document.getElementById("sparInfo").innerHTML = rader.join("<br>");
}

document.getElementById("spar").addEventListener("pointerdown", e => {
  e.preventDefault();
  const naa = Date.now();
  tapp = tapp.filter(t => naa - t < 1200);
  tapp.push(naa);
  if (tapp.length >= 3) { tapp = []; skjulSpar(); }
});
document.getElementById("btnSpar").addEventListener("click", () => sparPa ? skjulSpar() : visSpar());

function aktivitet() { sisteAktivitet = Date.now(); }
["pointerdown", "keydown"].forEach(e => document.addEventListener(e, aktivitet, true));
map.on("movestart zoomstart", aktivitet);

setInterval(() => {
  if (sparPa || !S.spar || document.hidden || soneModus) return;
  for (const id of ["panel", "ark", "koord"])
    if (document.getElementById(id).classList.contains("apen")) return;
  if (Date.now() - sisteAktivitet > S.spar * 60000) visSpar();
}, 5000);

/* ---- bakgrunnslyd: holder fanen i live når skjermen slås av ---- */
let lydEl = null;

function stilleLyd(sek) {
  const sr = 8000, n = sr * sek;
  const buf = new ArrayBuffer(44 + n), dv = new DataView(buf);
  const skriv = (o, t) => { for (let i = 0; i < t.length; i++) dv.setUint8(o + i, t.charCodeAt(i)); };
  skriv(0, "RIFF"); dv.setUint32(4, 36 + n, true); skriv(8, "WAVEfmt ");
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, sr, true); dv.setUint32(28, sr, true);
  dv.setUint16(32, 1, true); dv.setUint16(34, 8, true);
  skriv(36, "data"); dv.setUint32(40, n, true);
  for (let i = 0; i < n; i++) dv.setUint8(44 + i, 128 + (i & 1));  // ett bit — under hørselsgrensa
  return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
}

async function startBakgrunn() {
  if (lydEl) return true;
  try {
    lydEl = new Audio(stilleLyd(3));
    lydEl.loop = true;
    lydEl.volume = 0.1;
    await lydEl.play();
  } catch (e) { lydEl = null; return false; }
  if ("mediaSession" in navigator) {
    try {
      navigator.mediaSession.metadata = new MediaMetadata({ title: "Lyng sporer", artist: "Blåbærtur" });
      navigator.mediaSession.setActionHandler("pause", () => settBakgrunn(false));
      navigator.mediaSession.setActionHandler("play", () => { if (lydEl) lydEl.play(); });
    } catch (e) { /* eldre nettleser */ }
  }
  return true;
}

function stoppBakgrunn() {
  if (!lydEl) return;
  try { lydEl.pause(); lydEl.removeAttribute("src"); lydEl.load(); } catch (e) {}
  lydEl = null;
}

async function settBakgrunn(pa) {
  S.bg = pa ? 1 : 0;
  const sel = document.getElementById("setBg");
  if (pa) {
    const ok = await startBakgrunn();
    if (!ok) { S.bg = 0; melding("Fikk ikke startet — trykk en gang til"); }
    else melding("Bakgrunn på — lås skjermen og gå", 3000);
  } else {
    stoppBakgrunn();
  }
  sel.value = String(S.bg);
  lagreNa();
}

function hullTekst() {
  if (nativ) return "Bakgrunnstjenesten holder sporingen i gang — skjermsparing og lydtriks trengs ikke.";
  if (S.bg !== 1 && !hull.length) return "Strømsparing gjør skjermen svart, men appen sporer videre. Bakgrunn er et forsøk — telefonen din bestemmer om det virker.";
  if (!hull.length) return "Ingen hull i sporingen registrert. Fungerer på denne telefonen.";
  const lengste = Math.max(...hull.map(h => h.sek));
  return `${hull.length} hull over 90 sek, lengste ${Math.round(lengste / 60)} min. ` +
    (lengste > 420
      ? "Telefonen fryser appen når skjermen er av — bruk strømsparing i stedet."
      : "Sporingen har holdt seg noenlunde i live.");
}

/* ============================================================
   11. Eksport
   ============================================================ */
function lastNed(navn, innhold, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([innhold], { type }));
  a.download = navn;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}

function gpx() {
  const esc = s => String(s || "").replace(/[<>&]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]));
  const wpt = merker.map(m =>
    `  <wpt lat="${m.lat}" lon="${m.lng}"><time>${new Date(m.t).toISOString()}</time>` +
    `<name>${esc((FARGER[m.type] || FARGER.funn).navn)}${m.liter ? " " + m.liter + " l" : ""}</name>` +
    `<desc>${esc(m.notat)}</desc></wpt>`)
    .concat(bench.map(b =>
      `  <wpt lat="${b.lat}" lon="${b.lng}"><time>${new Date(b.t0).toISOString()}</time>` +
      `<name>Måling ${fmt1(rateLT(b))} l/t</name><desc>${b.liter} l, ${b.metode}, ${b.dist} m</desc></wpt>`))
    .join("\n");
  const trk = spor.map(p => `      <trkpt lat="${p[0]}" lon="${p[1]}"><time>${new Date(p[2]).toISOString()}</time></trkpt>`).join("\n");
  lastNed(`blaabaer-${new Date().toISOString().slice(0, 10)}.gpx`,
`<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Lyng" xmlns="http://www.topografix.com/GPX/1/1">
${wpt}
  <trk><name>Blåbærtur</name><trkseg>
${trk}
  </trkseg></trk>
</gpx>`, "application/gpx+xml");
}

/* ============================================================
   12. Grensesnitt
   ============================================================ */
let brodTimer;
function melding(t, ms) {
  const b = document.getElementById("brod");
  b.textContent = t; b.classList.add("vis");
  clearTimeout(brodTimer);
  brodTimer = setTimeout(() => b.classList.remove("vis"), ms || 2000);

function visArk(html) {
  const a = document.getElementById("ark");
  a.innerHTML = html;
  a.classList.add("apen");
}
function lukkArk() { document.getElementById("ark").classList.remove("apen"); }

document.querySelectorAll(".rail button").forEach(b =>
  b.addEventListener("click", () => nyttMerke(b.dataset.type)));

document.getElementById("btnFolg").addEventListener("click", e => {
  folg = !folg;
  e.currentTarget.classList.toggle("pa", folg);

map.on("dragstart", () => { folg = false; document.getElementById("btnFolg").classList.remove("pa"); });
map.on("moveend zoomend", oppdaterHud);

function settTaake(pa) {
  S.fog = pa ? 1 : 0;
  document.getElementById("setFog").value = String(S.fog);
  document.getElementById("btnTaake").classList.toggle("pa", !!pa);

  lagreNa();
}
document.getElementById("btnTaake").addEventListener("click", () => {

  melding(S.fog ? "Tåke på" : "Tåke av");
});

map.on("click", e => {
  if (soneModus && soneModus.modus === "tegn") soneLeggTil(e.latlng.lat, e.latlng.lng);
});
map.on("contextmenu", e => {

  const typer = ["funn", "senere", "tomt", "myr", "kratt", "bratt"];
  visArk(`<h4>Sett merke her</h4><div class="valg">` +
    typer.map(t => `<button data-ark-type="${t}"><span class="dot" style="background:${FARGER[t].farge}"></span>${FARGER[t].navn}</button>`).join("") +
    `</div>`);
  document.querySelectorAll("#ark [data-ark-type]").forEach(b =>
    b.onclick = () => { lukkArk(); nyttMerke(b.dataset.arkType, e.latlng); });
});

document.getElementById("btnLag").addEventListener("click", byttLag);
document.getElementById("btnMeny").addEventListener("click", () => {
  map.closePopup(); lukkArk();
  visLagringStatus(); oppdaterHud(); fyllLister();
  document.getElementById("hullTekst").textContent = hullTekst();
  document.getElementById("panel").classList.add("apen");
});
document.getElementById("btnLukk").addEventListener("click", () =>
  document.getElementById("panel").classList.remove("apen"));

function kobleValg(id, felt, etterpa) {
  const el = document.getElementById(id);
  el.value = String(S[felt]);
  el.addEventListener("change", () => {
    S[felt] = isNaN(+el.value) ? el.value : +el.value;
    lagreNa();
    if (etterpa) etterpa();
  });
}

function fyllLister() {
  const sl = document.getElementById("soneListe");
  sl.innerHTML = soner.length ? "" : '<div class="tom">Ingen soner ennå — trykk ⬡ på kartet.</div>';
  for (const s of soner) {
    const st = soneStat(s);
    const el = document.createElement("div");
    el.className = "el";
    el.innerHTML = `<div class="info"><b>${escHtml(s.navn)}</b>
      <small>${fmt1(st.daa)} daa · ${st.pst} % dekket · i år ${fmt1(st.literIAar)} l</small></div>
      <button>Vis</button>`;
    el.querySelector("button").onclick = () => {
      document.getElementById("panel").classList.remove("apen");
      map.fitBounds(L.latLngBounds(s.pkt).pad(0.2));
    };
    sl.appendChild(el);
  }

  const filterAar = S.aar === "alle" ? null : +S.aar;
  const bl = document.getElementById("benchListe");
  const bs = bench.filter(b => filterAar == null || new Date(b.t0).getFullYear() === filterAar);
  const rater = bs.map(rateLT).sort((a, b) => a - b);
  document.getElementById("benchOppsummering").textContent = rater.length
    ? `${rater.length} ${rater.length === 1 ? "måling" : "målinger"}: ${fmt1(rater[0])}–${fmt1(rater[rater.length - 1])} l/t · median ${fmt1(medianRate(filterAar))}`
    : "Start en måling med ⏱ når du begynner å plukke.";
  bl.innerHTML = "";
  for (const b of [...bs].reverse().slice(0, 25)) {
    const d = new Date(b.t0);
    const r1 = rate100(b);
    const el = document.createElement("div");
    el.className = "el";
    el.innerHTML = `<div class="info"><b>${fmt1(rateLT(b))} l/t${r1 != null ? " · " + fmt1(r1) + " l/100 m" : ""}</b>
      <small>${d.toLocaleDateString("no-NO", { day: "2-digit", month: "short" })} · ${Math.round((b.t1 - b.t0) / 60000)} min · ${fmt1(b.liter)} l · ${b.metode}</small></div>
      <button>Vis</button><button class="fare">Slett</button>`;
    const [vis, slett] = el.querySelectorAll("button");
    vis.onclick = () => {
      document.getElementById("panel").classList.remove("apen");
      map.setView([b.lat, b.lng], Math.max(map.getZoom(), 16));
    };
    slett.onclick = () => {
      if (!confirm("Slette målingen?")) return;
      bench = bench.filter(x => x.id !== b.id);
      lagreNa(); taake.tegn(); fyllLister(); oppdaterHud();
    };
    bl.appendChild(el);
  }
}

async function importer(tekst) {
  let d;
  try { d = JSON.parse(tekst); } catch (e) { melding("Klarte ikke lese fila"); return; }
  if (!d || typeof d !== "object") { melding("Klarte ikke lese fila"); return; }
  const nyMerker = (d.merker || []).filter(m => m && m.lat != null && m.lng != null);
  const nySoner = (d.soner || []).filter(x => x && Array.isArray(x.pkt) && x.pkt.length > 2);
  const nyBench = (d.bench || []).filter(x => x && x.t0 && typeof x.liter === "number");
  const cellerInn = d.celler || {};
  let antCeller = 0;
  for (const aar in cellerInn) antCeller += (cellerInn[aar] || []).length;
  if (!nyMerker.length && !nySoner.length && !nyBench.length && !antCeller) { melding("Fant ingen data i fila"); return; }
  if (!confirm(`Importere ${nyMerker.length} merker, ${nySoner.length} soner, ${nyBench.length} målinger og ${antCeller} ruter?\n\nDet du har fra før beholdes.`)) return;

  const mId = new Set(merker.map(x => x.id));
  for (const m of nyMerker) { if (m.type === "bil") m.type = "sekk"; if (!mId.has(m.id)) merker.push(m); }
  const sekker = merker.filter(m => m.type === "sekk").sort((a, b) => (b.t || 0) - (a.t || 0));
  if (sekker.length > 1) merker = merker.filter(m => m.type !== "sekk" || m === sekker[0]);
  const sId = new Set(soner.map(x => x.id));
  for (const x of nySoner) if (!sId.has(x.id)) soner.push(x);
  const bId = new Set(bench.map(x => x.id));
  for (const x of nyBench) if (!bId.has(x.id)) bench.push(x);
  for (const aar in cellerInn)
    for (const k of cellerInn[aar]) { const g = celler.get(k); if (g == null || g < +aar) celler.set(k, +aar); }
  if (S.lat0 == null && d.S && d.S.lat0 != null) S.lat0 = d.S.lat0;
  if (typeof d.distanse === "number" && d.distanse > distanse) distanse = d.distanse;
  if (Array.isArray(d.spor) && d.spor.length > spor.length) {
    spor = d.spor;
    if (S.track) sporLinje.setLatLngs(spor.map(x => [x[0], x[1]]));
  }
  await lagreNa();
  fyllAar(); tegnMerker(); tegnSoner(); taake.tegn(); oppdaterHud(); fyllLister();
  melding("Importert", 3000);
}

document.getElementById("btnImport").addEventListener("click", () => {
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = ".json,application/json";
  inp.style.display = "none";
  document.body.appendChild(inp);
  inp.onchange = async () => {
    const f = inp.files && inp.files[0];
    if (f) await importer(await f.text());
    inp.remove();
  };
  inp.click();
});

document.getElementById("btnGpx").addEventListener("click", gpx);
document.getElementById("btnBackup").addEventListener("click", () =>
  lastNed(`lyng-backup-${new Date().toISOString().slice(0, 10)}.json`, pakk(), "application/json"));
document.getElementById("btnNullstillSpor").addEventListener("click", () => {
  if (!confirm("Slette gålinjen? Tåke, merker, soner og målinger beholdes.")) return;
  spor = []; distanse = 0; sisteFix = null;
  sporLinje.setLatLngs([]); lagreNa(); oppdaterHud();
});
document.getElementById("btnNullstillAlt").addEventListener("click", async () => {
  if (!confirm("Slette ALT — tåke, merker, soner, målinger og gålinje? Kan ikke angres.")) return;
  celler.clear(); merker = []; soner = []; bench = []; spor = []; distanse = 0; sisteFix = null; hull = [];
  sporLinje.setLatLngs([]);
  await lagreNa();
  tegnMerker(); tegnSoner(); taake.tegn(); oppdaterHud(); fyllAar(); fyllLister();
  melding("Alt slettet");
});

function fyllAar() {
  const sel = document.getElementById("setYear");
  const aar = new Set();
  for (const [, a] of celler) aar.add(a);
  for (const m of merker) aar.add(new Date(m.t).getFullYear());
  for (const b of bench) aar.add(new Date(b.t0).getFullYear());
  const val = S.aar;
  sel.innerHTML = '<option value="alle">Alle år</option>' +
    [...aar].sort((a, b) => b - a).map(a => `<option value="${a}">${a}</option>`).join("");
  sel.value = val;
}

/* ---- oppstart ---- */
(async function oppstart() {
  await lastInn();
  kartlag.setUrl((LAG[S.lag] || LAG.topo).url);
  kobleValg("setGrid", "grid", () => {
    if (celler.size && !confirm("Ny rutestørrelse passer ikke med tåken du har fra før. Slette den gamle tåken?")) return;
    celler.clear(); lagreNa(); taake.tegn(); oppdaterHud();
  });
  kobleValg("setRadius", "radius");
  kobleValg("setAcc", "acc");
  kobleValg("setWake", "wake", () => settWake(S.wake === 1));
  kobleValg("setSpar", "spar");
  document.getElementById("setBg").value = String(S.bg);
  document.getElementById("setBg").addEventListener("change", e => settBakgrunn(e.target.value === "1"));
  kobleValg("setFog", "fog", () => settTaake(S.fog === 1));
  kobleValg("setRate", "rate", () => taake.tegn());
  kobleValg("setSoner", "soner", () => tegnSoner());
  kobleValg("setTrack", "track", () => sporLinje.setLatLngs(S.track ? spor.map(p => [p[0], p[1]]) : []));
  kobleValg("setYear", "aar", () => { taake.tegn(); tegnMerker(); tegnSoner(); oppdaterHud(); });

  if (nativ) {
    S.wake = 0; S.bg = 0;
    document.getElementById("radWake").style.display = "none";
    document.getElementById("radBg").style.display = "none";
    const st = document.getElementById("nativStatus");
    st.style.display = "";
    st.textContent = "Kjører som app. Sporingen går videre med låst skjerm i lomma — varselet i statuslinja viser at den er i gang."
      + (celler.size === 0 ? " Tomt kart? Hent JSON-kopien fra nettversjonen med Importer nederst." : "");
  }

  fyllAar();
  tegnMerker();
  tegnSoner();
  if (S.track) sporLinje.setLatLngs(spor.map(p => [p[0], p[1]]));
  if (spor.length) map.setView([spor[spor.length - 1][0], spor[spor.length - 1][1]], 15);
  document.getElementById("btnTaake").classList.toggle("pa", S.fog === 1);
  visLagringStatus();
  oppdaterHud();
  taake.tegn();
  sjekkSol();
  start();
  if (S.wake === 1) settWake(true);
  if (S.bg === 1) {   // lyd krever et trykk først
    const en = () => { startBakgrunn(); document.removeEventListener("pointerdown", en, true); };
    document.addEventListener("pointerdown", en, true);
  }
  setInterval(lagreNa, 30000);
})();
