name: Bygg Lyng-appen

on:
  workflow_dispatch:          # lar deg starte bygget manuelt fra Actions-fanen
  push:
    paths:
      - 'lyng.html'
      - 'src/**'
      - 'native/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'verktoy/klargjor.mjs'
      - 'verktoy/bygg-web.mjs'
      - 'verktoy/sjekk.mjs'
      - '.github/workflows/bygg.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Hent repoet
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Godta Android-lisenser
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      # Nøkkelen er versjonert fordi Android krever samme signatur ved hver
      # oppdatering. klargjor.mjs kobler debug-bygget eksplisitt til denne.
      - name: Kontroller fast signeringsnøkkel
        run: |
          test -f verktoy/debug.keystore
          keytool -list -keystore verktoy/debug.keystore \
            -storepass android -alias androiddebugkey > /dev/null

      - name: Installer avhengigheter
        run: npm ci

      - name: Test Survey-kjernen og syntaks
        run: |
          npm test
          npm run check

      - name: Klargjør offline web-app
        run: npm run build:web

      - name: Lag Android-prosjektet
        run: npx cap add android

      - name: Synk
        run: npx cap sync android

      - name: Tilpass Android-prosjektet
        env:
          BYGG: ${{ github.run_number }}
        run: node verktoy/klargjor.mjs

      - name: Bygg APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon

      - name: Kontroller fast app-signatur
        run: |
          forventet=$(keytool -list -v \
            -keystore verktoy/debug.keystore -storepass android -alias androiddebugkey \
            | awk '/SHA256:/{print $2; exit}')
          faktisk=$(keytool -printcert \
            -jarfile android/app/build/outputs/apk/debug/app-debug.apk \
            | awk '/SHA256:/{print $2; exit}')
          echo "Forventet SHA-256: $forventet"
          echo "Faktisk SHA-256:  $faktisk"
          test -n "$forventet"
          test "$forventet" = "$faktisk"

      - name: Legg APK-en ut for nedlasting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk lyng.apk
          gh release delete siste --yes --cleanup-tag || true
          gh release create siste lyng.apk \
            --title "Lyng - siste bygg" \
            --notes "Bygg ${{ github.run_number }}, laget $(date -u '+%d.%m.%Y %H:%M') UTC"

      - name: Reserve - last ned som artefakt
        if: ${{ always() && hashFiles('lyng.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: lyng-apk
          path: lyng.apk
